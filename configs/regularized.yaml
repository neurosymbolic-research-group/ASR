# ASR "Regularized" variant: Base + appearance regularisation (ARV) from the first epoch.
dataset:
  root: dataset/images
  img_size: [3, 256, 256]
  resize_shape: [256, 256]
training:
  batch_size: 32
  num_epochs: 50
  lr: 1.0e-3
  patience: 20
  early_stopping_on: train  # train | valid
  n_border_ignored: 16    # MMSE ignores a 16-px border
  augment: false
  save_model: true
  steps_per_epoch: 32     # 32 batches x 32 images = 1024 images per epoch
  valid_full_pass: false  # false: steps_per_epoch random batches; true: full pass
  grad_clip_norm: 1.0
  seed: 2001
renderer:
  beta: 1.0               # primitive fuzziness
modelers: {}              # scale index -> schedule; 0 = finest grid (8x8), 2 = coarsest (2x2)
arv:
  enabled: true
  start_epoch: 0
  lambda_a: 0.009
  alpha: 0.75             # exponent alpha in (0.5, 1)
  scale_weights: [0.6, 0.9, 1.2]  # encoder order: finest (8x8) ... coarsest (2x2)
testing:
  batch_size: 32
  weights: best.pt
  plot: true
  metrics: [mae, mse, ssim]
features:
  bag_size: 16
  aggregations: [mean, std]
  encoder_train_mode: true  # BatchNorm uses bag statistics; false = running statistics
  dtype: float16            # float16 | float32
  seed: 2001
classifier:
  criterion: [gini, entropy]
  max_depth: [3, 4, 5, 7, null]
  min_samples_leaf: [5, 10, 20]
  cv: 5
  tune_ccp_alpha: true
  seed: 0
plotting:
  canvas_plot_period: 2
  output_plot_period: 2
